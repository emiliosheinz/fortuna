name: fortuna-e2e

# Fully self-contained: every value here is a fixture, no .env required.
# `bin/fortuna e2e` runs the same way on any machine, in CI, or against
# a clean clone.  mock-oauth2-server plays the IdP so no real Google
# credentials are involved either.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fortuna_e2e
      POSTGRES_USER: fortuna_e2e
      POSTGRES_PASSWORD: e2e-fixed-postgres-password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: e2e-fixed-redis-password
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  setup:
    image: ghcr.io/emiliosheinz/fortuna-cli:latest
    volumes:
      - .:/fortuna
    environment:
      - CI=true
    command: sh -lc "pnpm install"
    restart: "no"

  migration:
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "turbo", "migration:run", "--filter=api"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      POSTGRES_DB: fortuna_e2e
      POSTGRES_USER: fortuna_e2e
      POSTGRES_PASSWORD: e2e-fixed-postgres-password
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/fortuna
    restart: "no"

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./docker/mock-oauth2:/config:ro

  api:
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      POSTGRES_DB: fortuna_e2e
      POSTGRES_USER: fortuna_e2e
      POSTGRES_PASSWORD: e2e-fixed-postgres-password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: e2e-fixed-redis-password
      OIDC_ISSUER_URL: http://mock-oauth2-server:8080/default
      GOOGLE_CLIENT_ID: e2e-client-id
    depends_on:
      setup:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
      mock-oauth2-server:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/fortuna

  web:
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
      API_BASE_URL: http://api:3000
      OIDC_ISSUER_URL: http://mock-oauth2-server:8080/default
      GOOGLE_CLIENT_ID: e2e-client-id
      GOOGLE_CLIENT_SECRET: e2e-client-secret
      GOOGLE_REDIRECT_URI: http://web:3001/api/auth/callback/google
    depends_on:
      setup:
        condition: service_completed_successfully
      mock-oauth2-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - .:/fortuna
      - e2e-web-next:/fortuna/apps/web/.next

  web-e2e:
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile.e2e
    environment:
      E2E_APP_BASE_URL: http://web:3001
    depends_on:
      setup:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - .:/fortuna

networks:
  default:
    driver: bridge

volumes:
  db-data:
  e2e-web-next:
