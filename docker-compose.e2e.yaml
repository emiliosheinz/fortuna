name: fortuna-e2e

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  setup:
    image: ghcr.io/emiliosheinz/fortuna-cli:latest
    volumes:
      - .:/fortuna
    environment:
      - CI=true
    command: sh -lc "pnpm install"
    restart: "no"

  migration:
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "api", "run", "migration:run"]
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/fortuna
    restart: "no"

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"

  api:
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      OIDC_ISSUER_URL: http://mock-oauth2-server:8080/default
      GOOGLE_CLIENT_ID: e2e-client-id
    depends_on:
      setup:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
      mock-oauth2-server:
        condition: service_started
    volumes:
      - .:/fortuna

  web:
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    environment:
      OIDC_ISSUER_URL: http://mock-oauth2-server:8080/default
      GOOGLE_CLIENT_ID: e2e-client-id
      GOOGLE_CLIENT_SECRET: e2e-client-secret
      GOOGLE_REDIRECT_URI: http://web:3001/api/auth/callback/google
      AUTH_SECRET: e2e-fixed-auth-secret-not-a-real-secret
    depends_on:
      setup:
        condition: service_completed_successfully
      mock-oauth2-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - .:/fortuna

  web-e2e:
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile.e2e
    env_file:
      - ./apps/web/.env
    depends_on:
      setup:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - .:/fortuna

networks:
  default:
    driver: bridge

volumes:
  db-data:
