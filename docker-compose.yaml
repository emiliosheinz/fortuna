name: fortuna

services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7-alpine
    env_file:
      - ./.env
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  setup:
    container_name: setup
    image: ghcr.io/emiliosheinz/fortuna-cli:latest
    volumes:
      - .:/fortuna
    environment:
      - CI=true
    command: sh -lc "pnpm install"
    restart: "no"

  workspace:
    container_name: workspace
    image: ghcr.io/emiliosheinz/fortuna-cli:latest
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/fortuna
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "tail -f /dev/null"
    restart: "no"

  migration:
    container_name: migration
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "api", "run", "migration:run"]
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/fortuna
    restart: "no"

  api:
    container_name: api
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    depends_on:
      setup:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - .:/fortuna
    ports:
      - "3000:3000"

  web:
    container_name: web
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - .:/fortuna
    ports:
      - "3001:3001"

networks:
  default:
    name: fortuna
    driver: bridge

volumes:
  db-data:
