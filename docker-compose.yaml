services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  setup:
    container_name: setup
    image: ghcr.io/emiliosheinz/fortuna-cli:latest
    volumes:
      - .:/fortuna
    environment:
      - CI=true
    command: sh -lc "pnpm install"
    restart: "no"

  workspace:
    container_name: workspace
    image: ghcr.io/emiliosheinz/fortuna-cli:latest
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/fortuna
    command: sh -c "tail -f /dev/null"
    restart: "no"

  migration:
    container_name: migration
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      TS_NODE_SKIP_PROJECT: "true"
      TS_NODE_COMPILER_OPTIONS: '{"module":"commonjs","target":"ES2023","esModuleInterop":true}'
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - .:/fortuna
    command: pnpm --filter=api migration:run
    restart: "no"

  api:
    container_name: api
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    depends_on:
      workspace:
        condition: service_started
      migration:
        condition: service_completed_successfully
    volumes:
      - .:/fortuna
    ports:
      - "3000:3000"

  web:
    container_name: web
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - .:/fortuna
    ports:
      - "3001:3001"

  web-e2e:
    container_name: web-e2e
    profiles: ["e2e"]
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile.e2e
    env_file:
      - ./apps/web/.env
    depends_on:
      setup:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    volumes:
      - .:/fortuna

networks:
  default:
    name: fortuna
    driver: bridge

volumes:
  db-data:
