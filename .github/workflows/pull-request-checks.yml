name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run linting
        run: pnpm turbo lint --affected

      - name: Run format check
        run: pnpm turbo format --affected

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run tests
        run: pnpm turbo test --affected

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Build projects
        run: pnpm turbo build --affected

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Build all Docker images
        run: pnpm turbo docker:build --affected

  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate all commits follow conventional commits
        uses: wagoid/commitlint-github-action@v6
        with:
          failOnWarnings: true
          configFile: .commitlintrc.json
          helpURL: https://www.conventionalcommits.org

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment:
      name: ci
      deployment: false
    strategy:
      matrix:
        app: [web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker-compose.e2e.yaml is fully self-contained — every value is
      # pinned to a fixture, no .env is consulted, no secrets are needed.
      - name: Run E2E Tests for ${{ matrix.app }}
        run: docker compose -f docker-compose.e2e.yaml up --exit-code-from ${{ matrix.app }}-e2e ${{ matrix.app }}-e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.e2e.yaml down -v || true

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    environment:
      name: ci
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Explicit CI fixtures, not borrowed from .env.example. Docker Compose
      # reads ${VAR} interpolation from the process environment, so no .env
      # file is needed. Distinctive values (fortuna_ci, ci-fixed-*) make CI
      # state obvious in logs and prevent dev/CI drift.
      - name: Run migrations
        env:
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          POSTGRES_SSL: "false"
          POSTGRES_DB: fortuna_ci
          POSTGRES_USER: fortuna_ci
          POSTGRES_PASSWORD: ci-fixed-postgres-password
        run: docker compose -f docker-compose.prod.yaml run --rm migration

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yaml down -v || true

  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [lint-format, test, build, docker-build, conventional-commits, e2e-tests, migration-check]
    if: always()

    steps:
      - name: Verify all checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks failed or were cancelled"
          exit 1

      - name: All checks passed
        run: echo "All PR checks passed successfully!"
