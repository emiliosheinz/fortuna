name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run linting
        run: pnpm turbo lint --affected

      - name: Run format check
        run: pnpm turbo format --affected

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run tests
        run: pnpm turbo test --affected

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Build projects
        run: pnpm turbo build --affected

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Build all Docker images
        run: pnpm turbo docker:build --affected

  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate all commits follow conventional commits
        uses: wagoid/commitlint-github-action@v6
        with:
          failOnWarnings: true
          configFile: .commitlintrc.json
          helpURL: https://www.conventionalcommits.org

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assemble environment variables
        uses: ./.github/actions/assemble-env
        with:
          apps: web
        env:
          # WEB
          WEB_PORT: ${{ vars.WEB_PORT }}
          WEB_HOST: ${{ vars.WEB_HOST }}
          WEB_E2E_APP_BASE_URL: ${{ vars.WEB_E2E_APP_BASE_URL }}
          # API
          API_PORT: ${{ vars.API_PORT }}
          API_HOST: ${{ vars.API_HOST }}
          API_DB_HOST: ${{ vars.API_DB_HOST }}
          API_DB_PORT: ${{ vars.API_DB_PORT }}
          API_DB_NAME: ${{ vars.API_DB_NAME }}
          API_DB_USER: ${{ secrets.API_DB_USER }}
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
          API_DB_SSL: ${{ vars.API_DB_SSL }}

      - name: Run E2E Tests for ${{ matrix.app }}
        run: docker compose -f docker-compose.prod.yaml --profile e2e up --exit-code-from ${{ matrix.app }}-e2e ${{ matrix.app }}-e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yaml down -v || true

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fortuna
          POSTGRES_USER: fortuna
          POSTGRES_PASSWORD: fortuna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fortuna -d fortuna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run migrations
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fortuna
          DB_USER: fortuna
          DB_PASSWORD: fortuna
          DB_SSL: "false"
        run: node node_modules/.bin/ts-node node_modules/.bin/typeorm migration:run -d src/data-source.ts

      - name: Assert no pending migrations
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fortuna
          DB_USER: fortuna
          DB_PASSWORD: fortuna
          DB_SSL: "false"
        run: |
          output=$(node node_modules/.bin/ts-node node_modules/.bin/typeorm migration:show -d src/data-source.ts)
          echo "$output"
          if echo "$output" | grep -q "\[ \]"; then
            echo "Pending migrations found. Run migration:run before merging."
            exit 1
          fi

  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [lint-format, test, build, docker-build, conventional-commits, e2e-tests, migration-check]
    if: always()

    steps:
      - name: Verify all checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks failed or were cancelled"
          exit 1

      - name: All checks passed
        run: echo "All PR checks passed successfully!"
