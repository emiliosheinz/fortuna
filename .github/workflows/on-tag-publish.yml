name: On tag publish

on:
  push:
    tags:
      - '@**/*@*' # matches @scope/name@1.2.3
      - '*@*'     # matches name@1.2.3

permissions:
  contents: read
  packages: write

concurrency:
  group: on-tag-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.tag.outputs.tag }}
      project: ${{ steps.tag.outputs.project }}
      version: ${{ steps.tag.outputs.version }}
      type:    ${{ steps.project_type.outputs.type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Extract project and version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF##*/}"  # Strip leading refs/tags/ to get raw tag name
          VERSION="${TAG##*@}"     # Version is the substring after the final '@'
          PROJECT="${TAG%@*}"      # Raw project part (may include scope) is everything before last '@'
          PROJECT="${PROJECT##*/}" # Keep only final path segment (drops optional scope like @scope/)
          PROJECT="${PROJECT#@}"   # Remove leading '@' if present (scope indicator)
          { echo "tag=$TAG"; echo "project=$PROJECT"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
      - name: Determine project type
        id: project_type
        run: |
          PROJECT="${{ steps.tag.outputs.project }}"
          if [ -f "packages/$PROJECT/package.json" ]; then
            echo "type=package" >> $GITHUB_OUTPUT
          elif [ -f "apps/$PROJECT/package.json" ]; then
            echo "type=app" >> $GITHUB_OUTPUT
          else
            echo "Project $PROJECT not found" >&2
            exit 1
          fi

  npm:
    name: Publish NPM package
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.type == 'package'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup node dependencies
        uses: ./.github/actions/setup-node-dependencies
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          PROJECT="${{ needs.setup.outputs.project }}"
          PACKAGE_PATH="packages/$PROJECT/package.json"
          PACKAGE_NAME=$(jq -r .name "$PACKAGE_PATH")
          IS_PRIVATE=$(jq -r 'if has("private") then .private else "false" end' "$PACKAGE_PATH")
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Package $PACKAGE_NAME is private. Skipping publish."
            exit 0
          fi
          echo "Publishing $PACKAGE_NAME version ${{ needs.setup.outputs.version }}"
          pnpm turbo build --filter="$PACKAGE_NAME"
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm publish --filter "$PACKAGE_NAME" --access public --no-git-checks

  docker:
    name: Build and push ${{ matrix.arch }} image
    needs: setup
    if: needs.setup.outputs.type == 'app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ needs.setup.outputs.project }}/Dockerfile
          target: prod
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/fortuna-${{ needs.setup.outputs.project }}:${{ needs.setup.outputs.version }}-${{ matrix.tag_suffix }}
            ghcr.io/${{ github.repository_owner }}/fortuna-${{ needs.setup.outputs.project }}:latest-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=fortuna-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fortuna-${{ matrix.arch }}
      - name: Append status to summary
        if: always()
        run: |
          {
            echo "## Docker (${{ matrix.arch }})"
            echo "- Platform: \`${{ matrix.platform }}\`"
            echo "- Runner: \`${{ matrix.runner }}\`"
            echo "- Result: \`${{ steps.build.outcome || 'unknown' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Create and push multi-arch manifest
    needs: [setup, docker]
    if: needs.setup.outputs.type == 'app'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fortuna-${{ needs.setup.outputs.project }}"
          VERSION="${{ needs.setup.outputs.version }}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  deploy:
    name: Deploy to production
    needs: [setup, manifest]
    # ponytail: paused, VPS decommissioned. See .specs/disable-deployments/spec.md
    if: false
    # Original guard, restored on re-enable:
    # if: needs.setup.outputs.type == 'app'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fortuna.emiliosheinz.com
    # Queue every production deploy so two tag pushes can't race the
    # compose lifecycle commands against the host.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Materialize .env from the production Environment
        uses: ./.github/actions/write-env-from-github
        with:
          vars: ${{ toJSON(vars) }}
          secrets: ${{ toJSON(secrets) }}
      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'ansible-core==2.17.7'
      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml
      - name: Prepare SSH identity and known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # DEPLOY_HOST_KEY must be a full known_hosts line, e.g.
          #   <ip> ssh-ed25519 AAAAC3Nz...
          # Captured once at host bring-up via `ssh-keyscan -t ed25519 <ip>`.
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Run deploy playbook
        working-directory: ansible
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          ansible-playbook deploy.yml \
            --private-key ~/.ssh/id_deploy \
            -e env_file="${GITHUB_WORKSPACE}/.env"
      - name: Append deploy status to summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo "- Target: \`fortuna.emiliosheinz.com\`"
            echo "- Tag: \`${{ needs.setup.outputs.tag }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Write output
    needs: [setup, npm, docker, manifest, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## On Tag Publish"
            echo "- Tag: \`${{ needs.setup.outputs.tag || 'n/a' }}\`"
            echo "- Project: \`${{ needs.setup.outputs.project || 'n/a' }}\`"
            echo "- Version: \`${{ needs.setup.outputs.version || 'n/a' }}\`"
            echo "- Type: \`${{ needs.setup.outputs.type || 'n/a' }}\`"
            echo ""
            echo "## Job results"
            echo "- npm: \`${{ needs.npm.result || 'skipped' }}\`"
            echo "- docker matrix: \`${{ needs.docker.result || 'skipped' }}\`"
            echo "- manifest: \`${{ needs.manifest.result || 'skipped' }}\`"
            echo "- deploy: \`${{ needs.deploy.result || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
