name: "Write .env from GitHub Environment"
description: "Materializes every var and secret in the caller's scope into a root .env file via toJSON + jq. Adding entries to the GitHub Environment is enough — no workflow change needed."

inputs:
  vars:
    description: "JSON-encoded vars object. The caller must pass toJSON(vars)."
    required: true
  secrets:
    description: "JSON-encoded secrets object. The caller must pass toJSON(secrets)."
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        VARS_JSON: ${{ inputs.vars }}
        SECRETS_JSON: ${{ inputs.secrets }}
      run: |
        # toJSON(vars) and toJSON(secrets) include every entry the workflow
        # has access to (repo-level + env-level merged). Repo-level entries
        # like SSH keys contain newlines that break the .env line format,
        # so we skip any value that can't fit on a single line.
        filter='to_entries[]
          | select(.value | type == "string")
          | select(.value | test("[\r\n]") | not)
          | "\(.key)=\(.value)"'
        {
          jq -r "$filter" <<< "$VARS_JSON"
          jq -r "$filter" <<< "$SECRETS_JSON"
        } > .env

branding:
  icon: download
  color: gray-dark
