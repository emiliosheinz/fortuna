# Public surface: fortuna.emiliosheinz.com (the app) and
# grafana.fortuna.emiliosheinz.com (operator-only Grafana).
# Certs are issued by certbot-bootstrap.yml; the renew sidecar refreshes them
# via the shared /var/www/certbot webroot.

# ACME HTTP-01 challenges + permanent HTTPS redirect for the app subdomain.
server {
    listen 80;
    listen [::]:80;
    server_name fortuna.emiliosheinz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ACME HTTP-01 challenges + permanent HTTPS redirect for the Grafana subdomain.
server {
    listen 80;
    listen [::]:80;
    server_name grafana.fortuna.emiliosheinz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# App subdomain: TLS-terminated reverse proxy to the web container on the
# internal `fortuna` bridge network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fortuna.emiliosheinz.com;

    ssl_certificate /etc/letsencrypt/live/fortuna.emiliosheinz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortuna.emiliosheinz.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    location / {
        proxy_pass http://web:3001;
    }
}

# Grafana subdomain: TLS-terminated reverse proxy to the grafana container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.fortuna.emiliosheinz.com;

    ssl_certificate /etc/letsencrypt/live/fortuna.emiliosheinz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortuna.emiliosheinz.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://grafana:3000;
    }
}
