groups:
  - name: fortuna-auth
    interval: 30s
    rules:
      - alert: AuthSignInFailureRateHigh
        expr: |
          sum(rate(auth_signin_attempts_total{outcome!~"success|failure_user_cancelled"}[5m]))
            / clamp_min(sum(rate(auth_signin_attempts_total{outcome!="failure_user_cancelled"}[5m])), 0.0001)
            > 0.25
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Sign-in failure rate >25% over 5 minutes
          description: |
            Investigate Google outage, certificate or clock skew, recent deploy.
            Excludes failure_user_cancelled from both numerator and denominator.
          runbook: docs/runbooks/auth-operator.md#sign-in-failure-rate-high

      - alert: AuthRateLimiterBlocksSpike
        expr: rate(auth_rate_limiter_blocks_total[1m]) * 60 > 100
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Rate-limiter blocking more than 100 requests per minute
          description: Possible brute-force or scraping. Verify and consider an IP block at the proxy.
          runbook: docs/runbooks/auth-operator.md#abuse-spike

      - alert: AuthAccountDeletionsSpike
        expr: increase(auth_account_deletions_total[1h]) > 10
        for: 5m
        labels:
          severity: page
        annotations:
          summary: More than 10 account deletions in the last hour
          description: Either abuse or a regression wiping accounts. Investigate fast.
          runbook: docs/runbooks/auth-operator.md#deletion-abuse

      - alert: AuthSignInLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(auth_signin_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: Sign-in p95 above 2s for 10 minutes
          description: Investigate Google JWKs latency, DB, downstream calls.
          runbook: docs/runbooks/auth-operator.md#sign-in-latency

      - alert: AuthLimiterDegraded
        expr: increase(auth_limiter_degraded_total[5m]) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: Rate limiter is failing open (Redis unreachable)
          description: Sign-ins continue without rate limiting. Restore Redis.
          runbook: docs/runbooks/auth-operator.md#redis-down
