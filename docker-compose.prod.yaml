services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    container_name: api
    image: ghcr.io/emiliosheinz/fortuna-api:latest
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: ${API_PORT:?required}
      HOST: ${API_HOST:?required}
      POSTGRES_HOST: ${POSTGRES_HOST:?required}
      POSTGRES_PORT: ${POSTGRES_PORT:?required}
      POSTGRES_SSL: ${POSTGRES_SSL:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_HOST: ${REDIS_HOST:?required}
      REDIS_PORT: ${REDIS_PORT:?required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    container_name: web
    image: ghcr.io/emiliosheinz/fortuna-web:latest
    build:
      context: .
      target: prod
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: ${WEB_PORT:?required}
      HOST: ${WEB_HOST:?required}
      API_BASE_URL: ${API_BASE_URL:?required}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?required}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  migration:
    container_name: migration
    image: ghcr.io/emiliosheinz/fortuna-api:latest
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/connection.js"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?required}
      POSTGRES_PORT: ${POSTGRES_PORT:?required}
      POSTGRES_SSL: ${POSTGRES_SSL:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.fortuna.emiliosheinz.com
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    command:
      - sh
      - -c
      - >-
        nginx -g 'daemon off;' &
        NGINX_PID=$$!;
        ( while kill -0 $$NGINX_PID 2>/dev/null; do
            sleep 21600;
            nginx -s reload 2>/dev/null || true;
          done ) &
        wait $$NGINX_PID
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
      grafana:
        condition: service_started
    restart: unless-stopped

  certbot:
    container_name: certbot
    image: certbot/certbot:v3.0.1
    entrypoint:
      - sh
      - -c
      - >-
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true;
          sleep 12h & wait $${!};
        done
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

networks:
  default:
    name: fortuna
    driver: bridge

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  certbot-certs:
    name: fortuna-certbot-certs
  certbot-webroot:
    name: fortuna-certbot-webroot
