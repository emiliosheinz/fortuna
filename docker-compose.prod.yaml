services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7-alpine
    env_file:
      - ./.env
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    container_name: api
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    container_name: web
    build:
      context: .
      target: prod
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "3001:3001"

  migration:
    container_name: migration
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/connection.js"]
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Scrapes apps/api at /metrics over the private `fortuna` network.
  # No ports: published — the dashboard reaches Prometheus through Grafana
  # (which IS port-published) so the scrape endpoint stays internal.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.3.1
    env_file:
      - ./.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # No default on purpose: prod must fail loud (empty admin password,
      # Grafana refuses to start) rather than silently boot with "admin" the
      # way dev compose does. Set GF_SECURITY_ADMIN_PASSWORD in ./.env.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3002:3000"
    restart: unless-stopped

networks:
  default:
    name: fortuna
    driver: bridge

volumes:
  db-data:
  prometheus-data:
  grafana-data:
