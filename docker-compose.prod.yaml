services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    container_name: api
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    container_name: web
    build:
      context: .
      target: prod
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://$${HOSTNAME}:$${PORT}/health || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "3001:3001"

  migration:
    container_name: migration
    profiles: ["migration"]
    build:
      context: .
      target: migration
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy

  web-e2e:
    container_name: web-e2e
    profiles: ["e2e"]
    environment:
      CI: "true"
    build:
      context: .
      target: prod
      dockerfile: apps/web/Dockerfile.e2e
    env_file:
      - ./apps/web/.env
    depends_on:
      web:
        condition: service_healthy

networks:
  default:
    name: fortuna
    driver: bridge

volumes:
  db-data:
